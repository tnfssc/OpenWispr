name: Android Voice CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/android-keyboard/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"
  pull_request:
    paths:
      - "apps/android-keyboard/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Fetch LFS objects in submodules
        working-directory: apps/android-keyboard/java/assets/futo-swipe
        run: git lfs pull

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test keyboard and build debug and release APKs
        working-directory: apps/android-keyboard
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ci-${{ github.run_number }}
          BRANCH_NAME: develop
        run: >-
          ./gradlew --max-workers=2
          testUnstableDebugUnitTest compileUnstableDebugAndroidTestJavaWithJavac
          assembleUnstableDebug assembleStableRelease

      - name: Upload APKs and test results
        uses: actions/upload-artifact@v7
        with:
          name: android-voice-${{ github.run_number }}
          path: |
            apps/android-keyboard/build/outputs/apk/unstable/debug/*.apk
            apps/android-keyboard/build/outputs/apk/stable/release/*.apk
            apps/android-keyboard/build/reports/tests/testUnstableDebugUnitTest/
          retention-days: 7
