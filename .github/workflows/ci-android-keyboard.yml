name: Android Voice CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/openwispr/**"
      - "apps/android-keyboard/voiceinput-shared/**"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/actions/VoiceInputAction.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/SettingsNavigator.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/pages/OpenWisprVoiceSettings.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/pages/VoiceInput.kt"
      - "apps/android-keyboard/src/test/**"
      - "apps/android-keyboard/tests/src/org/futo/inputmethod/latin/openwispr/**"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/v2keyboard/LayoutManager.kt"
      - "apps/android-keyboard/build.gradle"
      - "apps/android-keyboard/settings.gradle"
      - "apps/android-keyboard/gradle.properties"
      - "apps/android-keyboard/gradle/wrapper/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"
  pull_request:
    paths:
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/openwispr/**"
      - "apps/android-keyboard/voiceinput-shared/**"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/actions/VoiceInputAction.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/SettingsNavigator.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/pages/OpenWisprVoiceSettings.kt"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/latin/uix/settings/pages/VoiceInput.kt"
      - "apps/android-keyboard/src/test/**"
      - "apps/android-keyboard/tests/src/org/futo/inputmethod/latin/openwispr/**"
      - "apps/android-keyboard/java/src/org/futo/inputmethod/v2keyboard/LayoutManager.kt"
      - "apps/android-keyboard/build.gradle"
      - "apps/android-keyboard/settings.gradle"
      - "apps/android-keyboard/gradle.properties"
      - "apps/android-keyboard/gradle/wrapper/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Fetch LFS objects in submodules
        working-directory: apps/android-keyboard/java/assets/futo-swipe
        run: git lfs pull

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test keyboard and compile instrumentation tests
        working-directory: apps/android-keyboard
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ci-${{ github.run_number }}
          BRANCH_NAME: develop
        run: ./gradlew testUnstableDebugUnitTest compileUnstableDebugAndroidTestJavaWithJavac
