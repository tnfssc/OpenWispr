name: Android Keyboard CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/android-keyboard/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"
  pull_request:
    paths:
      - "apps/android-keyboard/**"
      - ".gitmodules"
      - ".github/workflows/ci-android-keyboard.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: apps/android-keyboard
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ci-${{ github.run_number }}
          BRANCH_NAME: develop
        run: ./gradlew assembleUnstableDebug test
