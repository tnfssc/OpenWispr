name: macOS CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/macos/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - ".github/workflows/ci.yml"

jobs:
  verify:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run lint, build, and tests
        working-directory: apps/macos
        run: ./scripts/check.sh
