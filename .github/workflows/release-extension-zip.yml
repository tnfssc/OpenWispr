name: Build Extension And Companion Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package release assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y jq zip rsync

      - name: Build extension zip
        id: build
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          EXT_DIR="extension"
          METADATA_FILE="$EXT_DIR/metadata.json"

          UUID="$(jq -r '.uuid' "$METADATA_FILE")"
          if [[ -z "$UUID" || "$UUID" == "null" ]]; then
            echo "metadata.json is missing a valid uuid"
            exit 1
          fi

          VERSION="${RELEASE_TAG:-manual-${GITHUB_SHA::7}}"
          VERSION="${VERSION#v}"

          BUILD_DIR="$(mktemp -d)"
          STAGE_DIR="$BUILD_DIR/$UUID"
          ZIP_NAME="${UUID}-${VERSION}.zip"
          ZIP_PATH="$BUILD_DIR/$ZIP_NAME"

          mkdir -p "$STAGE_DIR"

          rsync -a \
            --exclude 'models/' \
            --exclude 'schemas/gschemas.compiled' \
            "$EXT_DIR/" "$STAGE_DIR/"

          if [[ ! -f "$STAGE_DIR/metadata.json" || ! -f "$STAGE_DIR/extension.js" ]]; then
            echo "Package is missing required extension files"
            exit 1
          fi

          (
            cd "$STAGE_DIR"
            zip -r "$ZIP_PATH" .
          )

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Build companion binaries
        id: companion
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG:-manual-${GITHUB_SHA::7}}"
          VERSION="${VERSION#v}"

          DIST_DIR="$RUNNER_TEMP/openwispr-dist"
          mkdir -p "$DIST_DIR"

          for ARCH in amd64 arm64; do
            BIN_NAME="openwispr-linux-${ARCH}"
            GOOS=linux GOARCH="$ARCH" CGO_ENABLED=0 go build -trimpath -o "$DIST_DIR/$BIN_NAME" ./cmd/openwispr
            tar -C "$DIST_DIR" -czf "$DIST_DIR/${BIN_NAME}.tar.gz" "$BIN_NAME"
          done

          (
            cd "$DIST_DIR"
            sha256sum openwispr-linux-amd64.tar.gz openwispr-linux-arm64.tar.gz > openwispr-${VERSION}-checksums.txt
          )

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.zip_name }}
          path: ${{ steps.build.outputs.zip_path }}
          if-no-files-found: error

      - name: Upload companion artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwispr-companion-binaries
          path: |
            ${{ steps.companion.outputs.dist_dir }}/openwispr-linux-amd64.tar.gz
            ${{ steps.companion.outputs.dist_dir }}/openwispr-linux-arm64.tar.gz
            ${{ steps.companion.outputs.dist_dir }}/openwispr-*-checksums.txt
            companion/openwispr-engine.service
            companion/openwispr-hotkeyd.service
            companion/io.github.tnfssc.openwispr.desktop
            logo.png
          if-no-files-found: error

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ZIP_PATH: ${{ steps.build.outputs.zip_path }}
          DIST_DIR: ${{ steps.companion.outputs.dist_dir }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ZIP_PATH" \
            "$DIST_DIR"/openwispr-linux-amd64.tar.gz \
            "$DIST_DIR"/openwispr-linux-arm64.tar.gz \
            "$DIST_DIR"/openwispr-*-checksums.txt \
            companion/openwispr-engine.service \
            companion/openwispr-hotkeyd.service \
            companion/io.github.tnfssc.openwispr.desktop \
            logo.png \
            --clobber
