name: Release Android Keyboard

on:
  push:
    tags:
      - "keyboard-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build stable release APK
        working-directory: apps/android-keyboard
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: VERSION_NAME="${GITHUB_REF_NAME#keyboard-}" ./gradlew assembleStableRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --generate-notes apps/android-keyboard/build/outputs/apk/stable/release/*.apk
