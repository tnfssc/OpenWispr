name: Release Android Keyboard

on:
  push:
    tags:
      - "keyboard-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true

      - name: Fetch LFS objects in submodules
        working-directory: apps/android-keyboard/java/assets/futo-swipe
        run: git lfs pull

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build stable release APK
        working-directory: apps/android-keyboard
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: VERSION_NAME="${GITHUB_REF_NAME#keyboard-}" ./gradlew assembleStableRelease

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        # Titles must start with "OpenWispr Keyboard": Obtainium filters on them, because GNOME and
        # macOS releases share this repository's release list.
        run: |
          cd apps/android-keyboard/build/outputs/apk/stable/release
          sha256sum android-keyboard-stable-release.apk > android-keyboard-stable-release.apk.sha256
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "OpenWispr Keyboard ${RELEASE_TAG#keyboard-}" --generate-notes \
            android-keyboard-stable-release.apk android-keyboard-stable-release.apk.sha256
